<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhaleScope</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a12;color:#edf2ff;font:14px system-ui}
main{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0e1422;border:1px solid #202b42;border-radius:14px;padding:16px}
.v{font-size:25px;font-weight:800}.buy{color:#42e6a4}.sell{color:#ff6680}.pill{display:inline-block;padding:4px 9px;margin:3px;border:1px solid #33415f;border-radius:12px}
select{background:#111a2b;color:#fff;padding:9px;border:1px solid #33415f;border-radius:9px}table{width:100%;border-collapse:collapse}
td,th{padding:9px;border-bottom:1px solid #1d2638;text-align:right}td:first-child,th:first-child{text-align:left}
.note{opacity:.72;line-height:1.6}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.opt{display:none}}
</style></head><body><main>
<div class="top"><div><h1>WhaleScope</h1><div>BTC / ETH · 24H 大額合約成交雷達</div></div>
<select id="threshold"><option value="100000">$100K+</option><option value="500000" selected>$500K+</option><option value="1000000">$1M+</option></select></div>
<p id="health"></p>
<div class="grid">
<div class="card"><small>24H 主動買</small><div class="v buy" id="buy">$0</div></div>
<div class="card"><small>24H 主動賣</small><div class="v sell" id="sell">$0</div></div>
<div class="card"><small>NET FLOW</small><div class="v" id="net">$0</div></div>
<div class="card"><small>BUY / SELL</small><div class="v" id="ratio">—</div></div>
</div>
<div class="card" style="margin-top:12px"><h3>即時大額成交</h3><table>
<thead><tr><th>來源</th><th>幣</th><th>方向</th><th>名目金額</th><th class="opt">價格</th><th>時間</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<p class="note">CEX 公開成交只能辨識主動買/賣，無法辨識交易帳戶，也不能直接判定新開多或新開空。本服務僅做公開市場監控與統計，不執行交易。</p>
<script>
let trades=[];const $=id=>document.getElementById(id);
const money=n=>"$"+Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:2}).format(n);
function draw(){
 const threshold=+$("threshold").value, cutoff=Date.now()-864e5;
 const x=trades.filter(v=>v.ts>cutoff&&v.usd>=threshold);
 const buy=x.filter(v=>v.side==="BUY").reduce((s,v)=>s+v.usd,0);
 const sell=x.filter(v=>v.side==="SELL").reduce((s,v)=>s+v.usd,0);
 $("buy").textContent=money(buy);$("sell").textContent=money(sell);$("net").textContent=money(buy-sell);
 $("ratio").textContent=sell?(buy/sell).toFixed(2):"—";
 $("rows").innerHTML=x.slice(-120).reverse().map(v=>`<tr><td>${v.exchange}</td><td>${v.asset}</td><td class="${v.side==="BUY"?"buy":"sell"}">${v.side}</td><td>${money(v.usd)}</td><td class="opt">${Intl.NumberFormat().format(v.price)}</td><td>${new Date(v.ts).toLocaleTimeString()}</td></tr>`).join("");
}
fetch("/api/snapshot").then(r=>r.json()).then(j=>{
 trades=j.trades;$("health").innerHTML=Object.entries(j.health).map(([k,v])=>`<span class="pill">${k} · ${v}</span>`).join("");draw();
});
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
ws.onmessage=e=>{const j=JSON.parse(e.data);if(j.type==="trade"){trades.push(j.data);if(trades.length>12000)trades.shift();draw()}};
$("threshold").onchange=draw;setInterval(draw,5000);
</script></main></body></html>
